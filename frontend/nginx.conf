# ===========================================================================
# nginx configuration for the CivicFix AI frontend container.
#   - serves the compiled React single-page application
#   - reverse-proxies /api -> the Express backend container ("api")
# ===========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Security headers ---------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Backend API --------------------------------------------------------
    # The browser calls /api/... on the same origin, so the JWT never has to
    # cross an origin boundary and CORS stays out of the way.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # The chatbot may call the OpenAI API, so allow a generous timeout.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering off;
    }

    # --- Hashed build assets: cache aggressively ----------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Never cache the SPA shell ------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- SPA fallback: every unknown path is handled by React Router --------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
